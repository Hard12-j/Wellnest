server:
  port: ${PORT:8083}

spring:
  application:
    name: tracker-service
  datasource:
    # Neon:   (its own database)
    url: ${TRACKER_DB_URL}
    username: ${TRACKER_DB_USER}
    password: ${TRACKER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:192.168.1.10:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 3000

tracker:
  # Used for calorie estimates until we cache the user's weight from ProfileUpdated events
  default-weight-kg: 70
