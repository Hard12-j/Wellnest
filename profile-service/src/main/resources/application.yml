server:
  port: 8082

spring:
  application:
    name: profile-service
  datasource:
    # Neon: jdbc:postgresql://ep-hidden-art-b7i3c5sy-pooler.c-13.us-east-1.aws.neon.tech/ProfileService?sslmode=require  (its own database, never AuthService)
    url: ${PROFILE_DB_URL}
    username: ${PROFILE_DB_USER}
    password: ${PROFILE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:192.168.1.10:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 3000

profile:
  upload-dir: ${PROFILE_UPLOAD_DIR:./uploads/avatars}
  events-topic: profile.events
