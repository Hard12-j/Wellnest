server:
  port: ${PORT:8084}

spring:
  application:
    name: analytics-service
  datasource:
    # Neon: jdbc:postgresql://<host>/AnalyticsService?sslmode=require  (its own database)
    url: ${ANALYTICS_DB_URL}
    username: ${ANALYTICS_DB_USER}
    password: ${ANALYTICS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:192.168.1.10:9094}
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

analytics:
  tracker-topic: tracker.events
  profile-topic: profile.events
  insights:
    sleep-min-hours: 6.0          # a night under this counts as short sleep
    sleep-days-threshold: 3       # flag when this many of the last 7 days were short
    water-goal-ml: 2000
    water-days-threshold: 3       # flag when the goal was missed on this many of the last 7 days
    calorie-target: 2200          # net kcal (eaten - burned) per day; above it = surplus
    surplus-days-threshold: 3     # consecutive surplus days before flagging
    no-workout-days-threshold: 3  # consecutive workout-free days before flagging
