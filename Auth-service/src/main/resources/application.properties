spring.application.name=Auth-service
server.port=8081

spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${AUTH_JWT_SECRET}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-days=7

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# React dev server (Vite uses 5173, Create React App uses 3000)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

app.cookie.secure=false
app.cookie.same-site=Lax