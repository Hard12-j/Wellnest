spring.application.name=Auth-service
server.port=${PORT:8085}

spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${AUTH_JWT_SECRET}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-days=7

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JavaMail connection & socket timeouts to prevent infinite blocking / gateway timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Optional Resend API key for HTTP-based email delivery (works on Render free tier via HTTPS port 443)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Whether email sending failure should block registration (default false so dev/demo/blocked cloud SMTP won't fail registration)
app.mail.required=${APP_MAIL_REQUIRED:false}


# React dev server (Vite uses 5173, Create React App uses 3000)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

app.cookie.secure=false
app.cookie.same-site=Lax