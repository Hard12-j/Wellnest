spring.application.name=content-service
server.port=${PORT:8086}

# Neon PostgreSQL, database name: ContentService
# DB_URL example: jdbc:postgresql://<neon-host>/ContentService?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

content.upload-dir=uploads
