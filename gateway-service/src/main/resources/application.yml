server:
  port: ${PORT:8088}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods, RETAIN_UNIQUE

      routes:

        # ── 1. Auth Service (public – no JWT required) ───────────────────────────
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**
          filters:
            - name: RemoveRequestHeader
              args:
                name: X-User-Id
            - name: RemoveRequestHeader
              args:
                name: X-User-Role

        # ── 2. Profile Service ───────────────────────────────────────────────────
        - id: profile-service
          uri: ${PROFILE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/profile/**
          filters:
            - JwtAuth

        # ── 3. Tracker Service ───────────────────────────────────────────────────
        - id: tracker-service
          uri: ${TRACKER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/tracker/**
          filters:
            - JwtAuth

        # ── 4. Analytics Service ─────────────────────────────────────────────────
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/analytics/**
          filters:
            - JwtAuth

        # ── 5. Trainer Service ───────────────────────────────────────────────────
        - id: trainer-service
          uri: ${TRAINER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/trainers/**
          filters:
            - JwtAuth

        # ── 6. Content Service ───────────────────────────────────────────────────
        - id: content-service
          uri: ${CONTENT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/content/**
          filters:
            - JwtAuthOptional

        # ── 7. Chat Service – REST (JWT required) ────────────────────────────────
        - id: chat-service-rest
          uri: ${CHAT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/chat/**
          filters:
            - JwtAuth

        # ── 8. Chat Service – WebSocket (no HTTP-level JWT; STOMP CONNECT checks it) ─
        - id: chat-service-ws
          uri: ${CHAT_SERVICE_WS_URL:ws://localhost:8088}
          predicates:
            - Path=/ws/**

      httpclient:
        connect-timeout: 90000
        response-timeout: 120s

# JWT secret – default supplied for local development / debugging
jwt:
  secret: ${JWT_SECRET}

# Allowed origins for CORS (frontend dev + prod)
gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,routes
  endpoint:
    health:
      show-details: always
