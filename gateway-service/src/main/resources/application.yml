server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods, RETAIN_UNIQUE

      routes:

        # ── 1. Auth Service (public – no JWT required) ───────────────────────────
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/auth/**
          filters:
            - name: RemoveRequestHeader
              args:
                name: X-User-Id
            - name: RemoveRequestHeader
              args:
                name: X-User-Role

        # ── 2. Profile Service ───────────────────────────────────────────────────
        - id: profile-service
          uri: http://${PROFILE_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/profile/**
          filters:
            - JwtAuth

        # ── 3. Tracker Service ───────────────────────────────────────────────────
        - id: tracker-service
          uri: http://${TRACKER_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/tracker/**
          filters:
            - JwtAuth

        # ── 4. Analytics Service ─────────────────────────────────────────────────
        - id: analytics-service
          uri: http://${ANALYTICS_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/analytics/**
          filters:
            - JwtAuth

        # ── 5. Trainer Service ───────────────────────────────────────────────────
        - id: trainer-service
          uri: http://${TRAINER_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/api/trainers/**
          filters:
            - JwtAuth

        # ── 6. Content Service ───────────────────────────────────────────────────
        - id: content-service
          uri: http://${CONTENT_SERVICE_HOST:localhost}:8086
          predicates:
            - Path=/api/content/**
          filters:
            - JwtAuthOptional

        # ── 7. Chat Service – REST (JWT required) ────────────────────────────────
        - id: chat-service-rest
          uri: http://${CHAT_SERVICE_HOST:localhost}:8088
          predicates:
            - Path=/api/chat/**
          filters:
            - JwtAuth

        # ── 8. Chat Service – WebSocket (no HTTP-level JWT; STOMP CONNECT checks it) ─
        - id: chat-service-ws
          uri: ws://${CHAT_SERVICE_HOST:localhost}:8088
          predicates:
            - Path=/ws/**

# JWT secret – default supplied for local development / debugging
jwt:
  secret: ${JWT_SECRET}

# Allowed origins for CORS (frontend dev + prod)
gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,routes
  endpoint:
    health:
      show-details: always
